name: FIFA MLOps Labs 1-13

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  validate-train-monitor:
    runs-on: ubuntu-latest
    env:
      FIFA_DATA_PATH: ${{ github.workspace }}/data/ci/fifa_demo.csv
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate fictional CI fixture
        run: python -m fifa_churn.create_demo_data --output "$FIFA_DATA_PATH"

      - name: Run MLOps pipeline through batch inference
        run: python pipelines/run_all_labs.py --skip-monitor

      - name: Lab 12 - Feature and prediction monitoring
        run: python src/monitor.py --current-data "$FIFA_DATA_PATH"

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t fifa-player-risk-proxy:ci .

      - name: Save monitoring report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifa-monitoring-report
          path: reports/monitoring_report.json
          if-no-files-found: ignore
